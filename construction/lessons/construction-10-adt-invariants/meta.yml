id: construction-10
title: "Abstract data type invariants (invariantes del tipo abstracto de datos)"
concept: "Validity and lifecycle (validez y ciclo de vida)"
lesson_role: "core"
prerequisites:
  - construction-09
reading_time: "16 minutes"
estimated_time: "60 minutes"
acceptance_criteria:
  - "Identify `board_is_valid`, the bounds guards in `board_mark_visited` and
    `board_was_visited`, and the outside-active-area rule."
  - "Show that a fresh board reports `board_is_valid` true."
  - "Show that a guarded out-of-range write is rejected: `board_mark_visited(0, 0)` and
    `board_mark_visited(9, 9)` leave `board_was_visited` false and `board_is_valid` true."
  - "In a scratch copy, remove the bounds guard from `board_mark_visited`, call
    `board_mark_visited(0, 0)`, and show that `board_is_valid` becomes false."
  - "Restore the guard, show that `board_is_valid` stays true, and reproduce all 20 golden traces
    with the guard and without it."
  - "Explain what the trace proves, what the checker observes, and what neither proves."
  - "Show that `board_reset` does not repair a board that is already invalid."
  - "The tracked code files are not modified."
engineering_check: "Predict → Run → Compare → Explain → Record."
status: drafted
languages:
  - en
  - es
