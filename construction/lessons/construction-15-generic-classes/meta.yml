acceptance_criteria:
  - "Locate `Board<RowCount, ColumnCount>` and `GameEngine<RowCount, ColumnCount>` and name
    their non-type template parameters."
  - "Name the four operations `PositionedPiece` requires and find
    `static_assert(PositionedPiece<Knight>)`."
