  - "Reproduce all 20 golden traces on the unmodified 8×8 baseline."
  - "Instantiate the same `GameEngine` template for 8×8 and 10×10; show that the 10×10
    output differs from 8×8."
  - "Explain what is generic, what is constrained, and what changes with dimensions."
  - "Measure that `sizeof(Board<8, 8>)` equals `sizeof(Board<10, 10>)` and that both engines
    have the same size."
  - "Name the limit: the engine is generic over dimensions, not over the piece type."
  - "The tracked code files are not modified."
