id: construction-20
title: "Hexagonal (hexagonal)"
concept: "ports and adapters"
prerequisites:
  - "construction-08"
  - "construction-17"
reading_time: "26 minutes"
estimated_time: "92 minutes"
acceptance_criteria:
  - "Show that `GameEngine` includes `TranscriptPort`, not `ConsoleTranscript`, and that the core
    contains no `<cstdio>` and no `printf`."
  - "Locate the eight port methods, the sixteen overrides and the ten `port.*` call sites, and
    explain why the call sites outnumber the methods."
  - "Run the same `GameEngine<8, 8>` with `ConsoleTranscript` and with `RecordingTranscript`, and
    read the probe counts: 22 turns, 36 attempts, 21 moves, 1 trap, 1 winner."
  - "Show that the console transcript is byte-identical to all 20 golden traces."
  - "Add one port event in a scratch copy, implement it in both adapters, and show that the
    transcript is unchanged and the game loop (`playTurn`) is untouched."
  - "Measure the cost and record it: source lines 611 to 815, `game.o` text 4,656 to 4,138, console
    adapter object 1,341, binary text 9,668 to 10,748, data 692 to 876, and 8 indirect calls."
  - "Name the lifetime rule: the adapter must outlive the engine because the engine stores a
    reference to the port."
  - "Reproduce all 20 golden traces on the unmodified 8×8 baseline."
  - "The tracked code files are not modified."
engineering_check: "Predict → Run → Compare → Explain → Record."
