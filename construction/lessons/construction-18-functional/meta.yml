id: construction-18
title: "Functional style (funcional)"
concept: "purity and immutability"
lesson_role: "core"
prerequisites:
  - "construction-17"
reading_time: "22 minutes"
estimated_time: "85 minutes"
acceptance_criteria:
  - "Locate the four new function bodies and the three new public declarations: `history_size`,
    `undo_last_move`, `redo_last_move` and `record_history`, and explain why `board.h` and
    `move_generator.h` did not change."
  - "Explain why a snapshot must be a stored value and not a stored address: a `Board *` in the
    history would be mutated by the next `mark_visited`."
  - "Undo and redo a move through board history: run a game, record `history_size()`, call
    `undo_last_move()` and `redo_last_move()`, and find the two boundaries where they return
    `false`."
  - "Observe that the board is really restored from outside the engine, with a read-only accessor
    in a scratch copy, and show that `sizeof(GameEngine<8, 8>)` is still 56."
  - "Show that all 20 golden traces are byte-identical after the change, and that the `for` header
    count stays at 5 and the algorithm call sites stay at 3."
  - "Explain that undo is a value-copy lookup and not a replay of the move rules, and name the
    tradeoff: 256 bytes per accepted move, at most 201 snapshots at the 200-move cap."
  - "Name the three parts of the game state that the history does not store: the knight positions,
    the active-player flag and the random sequence state."
  - "Measure the cost and record it: `sizeof(GameEngine<8, 8>)` 24 to 56, `game.o` text 4,656 to
    7,240, binary text 9,668 to 12,368, and the allocations and bytes across the 20 seeds."
  - "Reproduce all 20 golden traces on the unmodified 8×8 baseline."
  - "The tracked code files are not modified."
engineering_check: "Predict → Run → Compare → Explain → Record."
status: drafted
languages:
  - en
  - es
