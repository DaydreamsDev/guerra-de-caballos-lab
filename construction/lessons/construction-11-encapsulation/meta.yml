id: construction-11
title: "Encapsulation (encapsulación)"
concept: "Class with invariant (clase con invariante)"
prerequisites:
  - construction-10
reading_time: "18 minutes"
estimated_time: "60 minutes"
acceptance_criteria:
  - "Identify the private state, the public operations and the access specifier in `board.h`."
  - "Show that a constructed `Board` is valid and that every public operation preserves the
    invariant."
  - "In a scratch copy, delete `private:` so `visited` becomes public, write
    `board.visited[0][0] = true`, and show that `board.is_valid()` becomes false."
  - "Restore `private:` and show that the same write no longer compiles."
  - "Reproduce all 20 golden traces with the class unchanged and with `visited` public."
  - "Explain what access control prevents, what it does not prevent, and why the traces cannot
    see the boundary."
  - "The tracked code files are not modified."
engineering_check: "Predict → Run → Compare → Explain → Record."
status: drafted
languages:
  - en
  - es
