id: archaeology-16
title: "Platform lock-in"
concept: "platform lock-in and adapters"
lesson_role: "optional"
prerequisites:
  - archaeology-01
reading_time: "25 minutes"
estimated_time: "60 minutes"
acceptance_criteria:
  - "The learner reads `code/platform.h`, `code/platform.cpp`, `code/main.cpp` and `run.sh`, and
    records the three-function port and the 5/18/11/19 line counts."
  - "The learner compiles the bench with the shipped flags
    (`-std=c++20 -Wall -Wextra -Werror -O2`) and records the compiler."
  - "The learner runs `./run.sh` and observes `adapter=portable` with exit code 0."
  - "The learner shows that `code/main.cpp` includes only `platform.h` and `<cstdio>`, and calls no
    `conio.h`, `system`, `getch` or `clrscr`."
  - "The learner copies the bench to a scratch directory and links the unchanged `main.cpp` against
    a second adapter, proving interface portability."
  - "The learner measures the ANSI adapter output at 30 bytes and the plain adapter output at 13
    bytes, and names the 17 escape bytes."
  - "The learner records the archive anchors at tag `v1.0.0`: lines 11–12 for the headers, line 32
    for `void main`, line 38 for `system(\"color 1f\")`, lines 42–43, and the 5 `getch` / 5
    `system(\"cls\")` counts."
  - "The learner states at least four behaviors the adapter does not guarantee across terminals:
    escape support, color capability, clear semantics, key semantics, redirection or encoding."
  - "The learner distinguishes portability of the interface from identity of behavior, with the
    30-byte versus 13-byte measurement as evidence."
  - "The learner records that `read_console_key` is declared, defined and never called, and that
    `TERM=dumb` does not change the output bytes."
  - "The learner states the evidence boundary: the marker proves the build and the call path, not
    the terminal behavior."
  - "The archive is unmodified and no repair is applied to `original/`."
engineering_check: "predict → inspect → isolate → compile → explain → record"
status: drafted
languages: [en, es]
